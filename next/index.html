<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Dress That Can't Decide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  /* Layout: a hand-inked seamstress's attic with the gown on a rug in the middle. The controls are sewing things:
     a stitched garment label for the title (top-left), four sewing buttons for actions (top-right),
     pinned fabric samples for cloth (right edge), and a rack of thread spools for color (bottom). Single theme by choice. */
  :root {
    color-scheme: light;
    --room: #1c1815;
    --linen: #f3ecdc;
    --ink: #33261f;
    --ink-soft: #6a5847;
    --rose: #a2454e;
    --wood: #5b4534;
    --brass: #c8b07a;
    --font-display: "Playfair Display", "Iowan Old Style", Georgia, serif;
    --font-type: "Special Elite", "Courier New", monospace;
    --drop: 2px 3px 0 rgba(18, 12, 8, 0.55);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--room); color: var(--ink); font-family: var(--font-type); overflow: hidden; }
  canvas#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas#stage.dragging { cursor: grabbing; }
  button { font-family: var(--font-type); }
  button:focus-visible { outline: 2px solid var(--linen); outline-offset: 4px; }

  /* title: a woven garment label with a stitched edge */
  .label {
    position: fixed; top: 18px; left: 20px; max-width: 17rem; padding: 16px 21px 13px; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(120,100,70,0.08) 0 1px, transparent 1px 3px),
                repeating-linear-gradient(90deg, rgba(120,100,70,0.08) 0 1px, transparent 1px 3px), var(--linen);
    outline: 1.5px dashed var(--rose); outline-offset: -7px; box-shadow: var(--drop); transform: rotate(-1.5deg);
  }
  h1 { font-family: var(--font-display); font-style: italic; font-weight: 600; font-size: 1.32rem; line-height: 1.15; margin: 0; text-wrap: balance; }
  .label p { margin: 7px 0 0; font-size: 0.72rem; line-height: 1.45; color: var(--ink-soft); }

  /* actions: sewing buttons */
  .actions { position: fixed; top: 20px; right: 22px; display: flex; gap: 16px; }
  .act { display: flex; flex-direction: column; align-items: center; gap: 7px; background: none; border: 0; padding: 0; cursor: pointer; font-size: 0.7rem; letter-spacing: 0.04em; }
  .act b {
    position: relative; display: block; width: 56px; height: 56px; border-radius: 50%; border: 1.5px solid var(--ink); box-shadow: var(--drop);
    background:
      radial-gradient(circle at 41% 41%, #2a201a 0 3px, transparent 3.6px), radial-gradient(circle at 59% 41%, #2a201a 0 3px, transparent 3.6px),
      radial-gradient(circle at 41% 59%, #2a201a 0 3px, transparent 3.6px), radial-gradient(circle at 59% 59%, #2a201a 0 3px, transparent 3.6px),
      radial-gradient(circle, transparent 0 17px, rgba(0,0,0,0.24) 17.5px 19px, transparent 19.5px),
      radial-gradient(circle at 34% 28%, rgba(255,255,255,0.4), transparent 58%), var(--b);
    transition: transform .14s ease;
  }
  .act:hover b { transform: translateY(-2px) rotate(10deg); }
  .act:active b { transform: translateY(2px); }
  .act[aria-pressed="true"] b::after { /* thread crossed through the holes when switched on */
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(45deg, transparent 43%, var(--rose) 43% 57%, transparent 57%) center / 16px 16px no-repeat,
                linear-gradient(-45deg, transparent 43%, var(--rose) 43% 57%, transparent 57%) center / 16px 16px no-repeat;
  }
  .act span { background: var(--linen); color: var(--ink); padding: 3px 7px 1px; box-shadow: 1px 2px 0 rgba(18,12,8,0.5); }

  /* cloth: pinned fabric samples with pinked edges */
  .cloths { position: fixed; right: 22px; top: 54%; transform: translateY(-50%); display: grid; grid-template-columns: repeat(2, auto); gap: 17px 15px; }
  .cloth { position: relative; background: none; border: 0; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 0.68rem; color: var(--ink); filter: drop-shadow(2px 3px 0 rgba(18,12,8,0.5)); transition: transform .15s ease; }
  .cloth:nth-child(odd) { transform: rotate(-3deg); }
  .cloth:nth-child(even) { transform: rotate(2.5deg); }
  .cloth:hover { transform: scale(1.06); }
  .cloth i { display: block; width: 66px; height: 50px; background: var(--sw); }
  .cloth::before { content: ""; position: absolute; top: -4px; left: 50%; width: 9px; height: 9px; margin-left: -4.5px; border-radius: 50%; z-index: 1;
    border: 1px solid var(--ink); background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.6), transparent 45%), var(--brass); }
  .cloth span { background: var(--linen); padding: 3px 6px 1px; }
  .cloth[aria-pressed="true"] { transform: scale(1.13); }
  .cloth[aria-pressed="true"]::before { background-color: var(--rose); }
  .cloth[aria-pressed="true"] span { background: var(--rose); color: var(--linen); }

  /* which part gets the color: small tags above the spools */
  .parts { position: fixed; bottom: 106px; left: 50%; transform: translateX(-50%); display: flex; gap: 9px; }
  .part { background: var(--linen); color: var(--ink); border: 0; padding: 4px 9px 2px; font-size: 0.7rem; letter-spacing: 0.04em; cursor: pointer; box-shadow: 1px 2px 0 rgba(18,12,8,0.5); }
  .part:nth-child(odd) { transform: rotate(-1.5deg); }
  .part:nth-child(even) { transform: rotate(1deg); }
  .part[aria-pressed="true"] { background: var(--rose); color: var(--linen); }

  /* color: a rack of thread spools */
  .rack { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; align-items: flex-end; gap: 9px;
    padding: 14px 18px 0; border-bottom: 10px solid var(--wood); border-radius: 0 0 3px 3px; box-shadow: 0 3px 0 rgba(18,12,8,0.6); max-width: calc(100% - 24px); }
  .spool { position: relative; flex: none; width: 26px; height: 46px; background: none; border: 0; padding: 0; cursor: pointer; transition: transform .15s ease; }
  .spool::before, .spool::after { content: ""; position: absolute; left: 0; right: 0; height: 8px; background: #d9c79c; border: 1.5px solid var(--ink); border-radius: 3px; z-index: 1; }
  .spool::before { top: 0; }
  .spool::after { bottom: 0; }
  .spool i { position: absolute; left: 3px; right: 3px; top: 6px; bottom: 6px; border-left: 1.5px solid var(--ink); border-right: 1.5px solid var(--ink);
    background: repeating-linear-gradient(5deg, rgba(0,0,0,0.17) 0 1px, transparent 1px 3.5px), var(--c); }
  .spool:hover { transform: translateY(-4px); }
  .spool[aria-pressed="true"] { transform: translateY(-11px); }
  .spool[aria-pressed="true"] i::after { content: ""; position: absolute; left: 50%; bottom: -20px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--linen); }

  #fail { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; text-align: center; color: #d8ccb4; font-size: 1rem; }
  @media (max-width: 760px) {
    .label { top: 10px; left: 10px; max-width: 11rem; padding: 12px 15px 10px; }
    h1 { font-size: 1rem; }
    .label p { display: none; }
    .actions { top: 12px; right: 10px; gap: 9px; }
    .act { font-size: 0.56rem; gap: 5px; }
    .act b { width: 40px; height: 40px; background-size: auto; }
    .act span { padding: 2px 4px 0; }
    .cloths { left: 0; right: 0; top: auto; bottom: 82px; transform: none; display: flex; gap: 14px; overflow-x: auto; padding: 8px 14px 6px; }
    .cloth { flex: none; }
    .cloth i { width: 54px; height: 40px; }
    .parts { bottom: 172px; gap: 7px; }
    .part { font-size: 0.62rem; padding: 3px 7px 1px; }
    .rack { left: 12px; right: 12px; transform: none; overflow-x: auto; justify-content: flex-start; max-width: none; padding: 14px 12px 0; }
  }
</style>
</head>
<body>
<canvas id="stage" aria-label="A ball gown on a dress form in a seamstress's attic. Drag to look around, tap the dress to throw a color at it."></canvas>
<div id="fail">This page needs 3D graphics (WebGL), and this browser has it turned off.</div>

<div class="label">
  <h1>The Dress That Can't Decide</h1>
  <p>Drag to look around. Tap the dress, or pick a spool, to throw a color. The tags above the spools choose which part it lands on.</p>
</div>

<div class="actions" role="group" aria-label="Actions">
  <button class="act" id="twirl" style="--b:#a97a7c"><b></b><span>Twirl</span></button>
  <button class="act" id="shake" style="--b:#7c8a68"><b></b><span>Shake out</span></button>
  <button class="act" id="breeze" style="--b:#6a7d90"><b></b><span>Breeze</span></button>
  <button class="act" id="argue" style="--b:#bfa15c" aria-pressed="true"><b></b><span>Argue</span></button>
</div>

<div class="cloths" id="cloths" role="group" aria-label="Cloth"></div>
<div class="parts" id="parts" role="group" aria-label="Part of the dress to color">
  <button class="part" id="p-all" aria-pressed="true">Whole dress</button>
  <button class="part" id="p-bodice" aria-pressed="false">Bodice</button>
  <button class="part" id="p-skirt" aria-pressed="false">Skirt</button>
  <button class="part" id="p-trim" aria-pressed="false">Trim</button>
</div>
<div class="rack" id="swatches" role="group" aria-label="Thread color to throw"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>

<script>

    ["Sunset blend", "linear-gradient(#7a3fc8,#f0508c,#ffb43c)", ramp([[255, 180, 60], [240, 80, 140], [122, 63, 200]])],
    ["Mermaid blend", "linear-gradient(#7450d8,#2e86e6,#32d6c0)", ramp([[50, 214, 192], [46, 134, 230], [116, 80, 216]])],
    ["Dawn blend", "linear-gradient(#f58cc8,#c9a0f0,#7ec8ff)", ramp([[126, 200, 255], [201, 160, 240], [245, 140, 200]])],
    ["Rainbow", "conic-gradient(#ff5a7a,#ffb43c,#5fd68a,#3ea0f0,#a064e6,#ff5a7a)", {
      rgb: [255, 255, 255], lin: [1, 1, 1], fn: function (x, y, z, out) {
        var c = hslToRgb((((Math.atan2(x, z) / 6.283 + y * 0.45) % 1) + 1) % 1 * 360, 0.8, 0.58);
        out[0] = lin(c[0]); out[1] = lin(c[1]); out[2] = lin(c[2]);
      }
    }],
    ["Surprise color", "radial-gradient(#fff 18%,#e58ab8 24%,#7d6cd0 72%)", null]
  ];
  var chosen = 1, duel = [PAINTS[1][2], PAINTS[8][2]], duelTurn = 1, splashes = [], splashId = 0, lastCast = 0;
  function pickPaint() { return PAINTS[chosen][2] || solid(hslToRgb(Math.random() * 360, 0.7, 0.56)); }

  function paintable(geo, turns, lighten, part) {
    var n = geo.attributes.position.count, o = {
      geo: geo, turns: turns, lighten: lighten || 0, part: part, n: n, cur: new Float32Array(n * 3), tgt: new Float32Array(n * 3),
      fl: new Float32Array(n), stamp: new Int32Array(n)
    };
    var start = PAINTS[1][2].lin;
    for (var i = 0; i < n; i++) for (var k = 0; k < 3; k++) o.cur[i * 3 + k] = o.tgt[i * 3 + k] = start[k];
    return o;
  }
  // The dress is dyed in three parts. The trim is the neckline ruffle plus the petticoat edge.
  var paints = [
    paintable(skirtGeo, false, 0, "skirt"), paintable(bodiceGeo, true, 0, "bodice"),
    paintable(frillGeo, true, 0.26, "trim"), paintable(pettiGeo, false, 0.42, "trim")
  ], tmpC = [0, 0, 0];
  var partChoice = "all"; // which part the next color lands on
  paints[1].shade = bodiceShade;

  function updatePaint(dt) {
    var mix = 1 - Math.exp(-dt * 5), fadeF = Math.exp(-dt * 3), cs = Math.cos(theta), sn = Math.sin(theta);
    for (var s = splashes.length - 1; s >= 0; s--) { splashes[s].r += (calm ? 4 : 1.5) * dt; if (splashes[s].r > 5) splashes.splice(s, 1); }
    for (var q = 0; q < paints.length; q++) {
      var o = paints[q], p = o.geo.attributes.position.array, col = o.geo.attributes.color.array, L = o.lighten;
      for (var i = 0; i < o.n; i++) {
        var x = p[i * 3], y = p[i * 3 + 1], z = p[i * 3 + 2];
        if (o.turns) { var tx = x * cs + z * sn; z = -x * sn + z * cs; x = tx; }
        for (var s2 = 0; s2 < splashes.length; s2++) {
          var sp = splashes[s2];
          if (o.stamp[i] === sp.id || !sp.parts[o.part]) continue;
          var ex = x - sp.x, ey = y - sp.y, ez = z - sp.z;
          // the edge of the color creeps unevenly, like dye soaking into cloth
          var rr = sp.r * (1 + 0.2 * (Math.sin(x * 9 + sp.id * 1.3) * Math.sin(y * 11 + 1.7) + 0.6 * Math.sin(z * 8 + sp.id)));
          if (ex * ex + ey * ey + ez * ez <= rr * rr) {
            o.stamp[i] = sp.id; o.fl[i] = 1;
            var c3 = sp.paint.lin;
            if (sp.paint.fn) { sp.paint.fn(x, y, z, tmpC); c3 = tmpC; }
            o.tgt[i * 3] = c3[0]; o.tgt[i * 3 + 1] = c3[1]; o.tgt[i * 3 + 2] = c3[2];
            if (!calm && q === 0 && Math.random() < 0.012) spark(x, y, z, sp.paint.rgb, 0.5);
          }
        }
        var f = o.fl[i] * 0.15; o.fl[i] *= fadeF;
        for (var k = 0; k < 3; k++) {
          var c = i * 3 + k; o.cur[c] += (o.tgt[c] - o.cur[c]) * mix;
          var v = o.cur[c] + f; if (o.shade) v *= o.shade[i]; col[c] = L ? v + (1 - v) * L : v;
        }
      }
      o.geo.attributes.color.needsUpdate = true;
    }
    var sk = paints[0], ar = 0, ag = 0, ab = 0, cnt = 0;
    for (var v2 = 0; v2 < sk.n; v2 += 11) { ar += sk.cur[v2 * 3]; ag += sk.cur[v2 * 3 + 1]; ab += sk.cur[v2 * 3 + 2]; cnt++; }
  }

  // ---------- sparkles: bursts and drifting fairy dust ----------
  var dot = document.createElement("canvas"); dot.width = dot.height = 64;
  (function () {
    var g = dot.getContext("2d"), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(0.2, "rgba(255,255,255,0.7)"); gr.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  })();
  var dotTex = new THREE.CanvasTexture(dot);
  function pointCloud(n, size) {
    var geo = new THREE.BufferGeometry(), pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
    for (var i = 0; i < n; i++) pos[i * 3 + 1] = -50;
    geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
    var pts = new THREE.Points(geo, new THREE.PointsMaterial({ size: size, map: dotTex, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    pts.frustumCulled = false; scene.add(pts);
    return { geo: geo, pos: pos, col: col };
  }
  var SN = 360, burst = pointCloud(SN, 0.05), sVel = new Float32Array(SN * 3), sLife = new Float32Array(SN), sBase = new Float32Array(SN * 3), sNext = 0;
  function spark(x, y, z, rgb, speed) {
    var i = sNext; sNext = (sNext + 1) % SN;
    burst.pos[i * 3] = x; burst.pos[i * 3 + 1] = y; burst.pos[i * 3 + 2] = z;
    var a = Math.random() * 6.283, u = Math.random() * 2 - 1, r = Math.sqrt(1 - u * u), v = speed * (0.3 + Math.random());
    sVel[i * 3] = Math.cos(a) * r * v; sVel[i * 3 + 1] = u * v + 0.3; sVel[i * 3 + 2] = Math.sin(a) * r * v;
    for (var k = 0; k < 3; k++) sBase[i * 3 + k] = (lin(rgb[k]) + 1) * 1.3;
    sLife[i] = 1;
  }
  var DN = calm ? 30 : 70, dust = pointCloud(DN, 0.028), dSeed = [];
  var dustTint = [[2.4, 2.1, 1.5], [2.2, 2.0, 1.9], [1.7, 2.0, 2.5], [2.2, 2.2, 2.2]];
  for (var d0 = 0; d0 < DN; d0++) dSeed.push({ a: rnd(0, 6.283), r: rnd(0.45, 1.9), y: rnd(0, 2.4), v: rnd(0.04, 0.16), w: rnd(0.05, 0.3) * (d0 % 2 ? 1 : -1), p: rnd(0, 6.28), s: rnd(1, 3.5), t: dustTint[d0 % 4] });
  function updateSparks(dt, time) {
    for (var i = 0; i < SN; i++) {
      if (sLife[i] <= 0) continue;
      sLife[i] -= dt * 1.1;
      if (sLife[i] <= 0) { burst.pos[i * 3 + 1] = -50; continue; }
      sVel[i * 3 + 1] -= 0.9 * dt;
      for (var k = 0; k < 3; k++) { burst.pos[i * 3 + k] += sVel[i * 3 + k] * dt; burst.col[i * 3 + k] = sBase[i * 3 + k] * sLife[i]; }
    }
    burst.geo.attributes.position.needsUpdate = true; burst.geo.attributes.color.needsUpdate = true;
    var tt = calm ? 0 : time, swirl = 1 + Math.min(3, Math.abs(omega));
    for (var d = 0; d < DN; d++) {
      var s = dSeed[d];
      if (!calm) { s.a += s.w * dt * swirl + omega * dt * 0.25; s.y += s.v * dt; if (s.y > 2.4) s.y = 0; }
      dust.pos[d * 3] = Math.cos(s.a) * s.r; dust.pos[d * 3 + 1] = s.y; dust.pos[d * 3 + 2] = Math.sin(s.a) * s.r;
      var edge = Math.min(1, s.y * 4, (2.4 - s.y) * 2), tw = (0.35 + 0.65 * Math.pow(0.5 + 0.5 * Math.sin(tt * s.s + s.p), 3)) * edge;
      dust.col[d * 3] = s.t[0] * tw; dust.col[d * 3 + 1] = s.t[1] * tw; dust.col[d * 3 + 2] = s.t[2] * tw;
    }
    dust.geo.attributes.position.needsUpdate = true; dust.geo.attributes.color.needsUpdate = true;
  }

  function cast(x, y, z, paint, quiet) {
    // Remember which part was chosen when the color was thrown, so switching parts mid-spread doesn't redirect it.
    var parts = partChoice === "all" ? { skirt: 1, bodice: 1, trim: 1 } : {};
    parts[partChoice] = 1;
    splashes.push({ x: x, y: y, z: z, paint: paint, parts: parts, r: 0, id: ++splashId });
    if (!quiet) { if (paint !== duel[1]) duel = [duel[1], paint]; duelTurn = 0; }
    for (var i = 0, n = calm ? 8 : 40; i < n; i++) spark(x, y, z, paint.rgb, 1.3);
  }

  // ---------- camera and pointer ----------
  var yaw = 0, pitch = 0.1, yawV = 0, pitchV = 0, dist = 5;
  var y0 = /[?&]yaw=(-?[\d.]+)/.exec(query); if (y0) yaw = parseFloat(y0[1]);
  var p0 = /[?&]pitch=(-?[\d.]+)/.exec(query); if (p0) pitch = parseFloat(p0[1]);
  function placeCamera() {
    camera.position.set(Math.sin(yaw) * Math.cos(pitch) * dist, 0.85 + Math.sin(pitch) * dist, Math.cos(yaw) * Math.cos(pitch) * dist);
    camera.lookAt(0, 0.8, 0); camera.updateMatrixWorld();
  }
  var ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  var down = null, lastX = 0, lastY = 0, lastT = 0, orbiting = false;
  function setRay(e) {
    ndc.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
    ray.setFromCamera(ndc, camera);
  }
  function castAt(e) {
    setRay(e);
    var hits = ray.intersectObjects([skirt, bodice], false), p;
    if (hits.length) p = hits[0].point;
    else {
      var o = ray.ray.origin, d = ray.ray.direction;
      var t = (0 - o.x) * d.x + (0.7 - o.y) * d.y + (0 - o.z) * d.z;
      p = o.clone().addScaledVector(d, t);
    }
    cast(p.x, p.y, p.z, pickPaint(), false);
    lastCast = performance.now();
  }
  canvas.addEventListener("pointerdown", function (e) {
    down = { x: e.clientX, y: e.clientY, t: performance.now(), moved: false };
    lastX = e.clientX; lastY = e.clientY; lastT = down.t;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener("pointermove", function (e) {
    var now = performance.now(), dt = Math.max(8, now - lastT) / 1000;
    var mxp = e.clientX - lastX, myp = e.clientY - lastY;
    if (down) {
      if (Math.abs(e.clientX - down.x) + Math.abs(e.clientY - down.y) > 7) { down.moved = true; orbiting = true; canvas.classList.add("dragging"); }
      if (orbiting) { yawV = -mxp * 0.0045 / dt; pitchV = myp * 0.0035 / dt; yaw += -mxp * 0.0045; pitch += myp * 0.0035; }
    } else if (e.pointerType === "mouse") {
      setRay(e);
      rayO.copy(ray.ray.origin); rayD.copy(ray.ray.direction);
      var right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
      var up = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);
      var k = 5 / window.innerHeight / dt;
      gust.addScaledVector(right, mxp * k).addScaledVector(up, -myp * k);
      gust.addScaledVector(rayD, Math.hypot(mxp, myp) * k * 0.4);
      if (gust.length() > 45) gust.setLength(45);
      gustOn = true;
    }
    lastX = e.clientX; lastY = e.clientY; lastT = now;
  });
  function endDrag() { down = null; orbiting = false; canvas.classList.remove("dragging"); }
  canvas.addEventListener("pointerup", function (e) {
    if (down && !down.moved && performance.now() - down.t < 500) castAt(e);
    endDrag();
  });
  canvas.addEventListener("pointercancel", endDrag);
  canvas.addEventListener("pointerleave", function () { gustOn = false; });

  // ---------- sewing-room controls ----------
  var swatchRow = document.getElementById("swatches"), swatchEls = [];
  function throwColor() {
    var rp = M + Math.floor(Math.random() * (NP - M));
    cast(X[rp], Y[rp], Z[rp], pickPaint(), false); lastCast = performance.now();
  }
  PAINTS.forEach(function (p, i) { // one spool of thread per color
    var b = document.createElement("button");
    b.className = "spool"; b.id = "c-" + i; b.style.setProperty("--c", p[1]);
    b.setAttribute("aria-label", p[0]); b.title = p[0];
    b.setAttribute("aria-pressed", i === chosen ? "true" : "false");
    b.appendChild(document.createElement("i"));
    b.addEventListener("click", function () {
      chosen = i;
      swatchEls.forEach(function (o, k) { o.setAttribute("aria-pressed", k === i ? "true" : "false"); });
      throwColor();
    });
    swatchRow.appendChild(b); swatchEls.push(b);
  });
  function pinked(nx, ny) { // zigzag outline, like cloth cut with pinking shears
    var pts = [], d = 6, k;
    for (k = 0; k <= nx; k++) pts.push((k / nx * 100).toFixed(1) + "% " + (k % 2 ? d : 0) + "%");
    for (k = 1; k <= ny; k++) pts.push((100 - (k % 2 ? d * 0.75 : 0)) + "% " + (k / ny * 100).toFixed(1) + "%");
    for (k = nx - 1; k >= 0; k--) pts.push((k / nx * 100).toFixed(1) + "% " + (100 - (k % 2 ? d : 0)) + "%");
    for (k = ny - 1; k >= 1; k--) pts.push((k % 2 ? d * 0.75 : 0) + "% " + (k / ny * 100).toFixed(1) + "%");
    return "polygon(" + pts.join(",") + ")";
  }
  var clothRow = document.getElementById("cloths"), clothEls = {}, pinkedPath = pinked(12, 8);
  function setFabric(name) {
    fabricName = name;
    skirt.material = FABRICS[name].mat;
    bodice.material = SHEER[name] ? FABRICS.satin.mat : FABRICS[name].mat;
    lining.visible = true; shellA.visible = shellB.visible = name === "tulle" || name === "chiffon";
    shellA.material = shellB.material = skirt.material;
    Object.keys(clothEls).forEach(function (k) { clothEls[k].setAttribute("aria-pressed", k === name ? "true" : "false"); });
  }
  Object.keys(FABRICS).forEach(function (name) {
    var b = document.createElement("button"), sw = document.createElement("i"), lb = document.createElement("span");
    b.className = "cloth"; b.id = "f-" + name; sw.style.setProperty("--sw", FABRICS[name].sw); sw.style.clipPath = pinkedPath; lb.textContent = FABRICS[name].label;
    b.appendChild(sw); b.appendChild(lb);
    b.addEventListener("click", function () { setFabric(name); });
    clothRow.appendChild(b); clothEls[name] = b;
  });
  setFabric(fabricName);
  document.getElementById("twirl").addEventListener("click", function () { omega = (omega < 0 ? -1 : 1) * 8.5; });
  document.getElementById("shake").addEventListener("click", function () { // toss the skirt up flat and let it fall
    var cs = Math.cos(theta), sn = Math.sin(theta);
    for (var j = 1; j < NR; j++) for (var i = 0; i < M; i++) {
      var id = j * M + i, phi = (i / M) * Math.PI * 2, s = j * SEG, r = 0.13 + s * 0.93;
      var lx = r * Math.sin(phi), lz = r * Math.cos(phi);
      X[id] = QX[id] = lx * cs + lz * sn; Z[id] = QZ[id] = -lx * sn + lz * cs;
      Y[id] = QY[id] = WAIST + 0.06 + s * 0.12 + 0.02 * Math.sin(phi * 7);
    }
  });
  document.getElementById("breeze").addEventListener("click", function () {
    breezeDir.setFromMatrixColumn(camera.matrixWorld, 0); breezeDir.y = 0.15; breezeT = 1.8;
  });
  var partEls = document.querySelectorAll(".part");
  partEls.forEach(function (b) {
    b.addEventListener("click", function () {
      partChoice = b.id.slice(2);
      partEls.forEach(function (o) { o.setAttribute("aria-pressed", o === b ? "true" : "false"); });
    });
  });
  var argueBtn = document.getElementById("argue"), argue = !calm;
  argueBtn.setAttribute("aria-pressed", argue ? "true" : "false");
  argueBtn.addEventListener("click", function () {
    argue = !argue; argueBtn.setAttribute("aria-pressed", argue ? "true" : "false");
    lastCast = performance.now() - 2600;
  });

  // ---------- finishing pass: soft glow, then an old-print grade with grain ----------
  var composer = null, finalPass = null;
  if (THREE.EffectComposer && THREE.RenderPass && THREE.UnrealBloomPass && THREE.ShaderPass && renderer.capabilities.isWebGL2) {
    try {
      var rt = new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, samples: 4 });
      composer = new THREE.EffectComposer(renderer, rt);
      composer.addPass(new THREE.RenderPass(scene, camera));
      composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(256, 256), 0.45, 0.7, 1.25));
      finalPass = new THREE.ShaderPass({
        uniforms: { tDiffuse: { value: null }, time: { value: 0 } },
        vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
        fragmentShader: [
          "uniform sampler2D tDiffuse; uniform float time; varying vec2 vUv;",
          "void main(){",
          "  vec3 c = texture2D(tDiffuse, vUv).rgb;",
          "  float m = max(max(c.r, c.g), c.b);",
          "  c *= (1.0 + m / 16.0) / (1.0 + m) * 1.45;",
          "  c = pow(clamp(c, 0.0, 1.0), vec3(1.0 / 2.2));",
          "  float l = dot(c, vec3(0.299, 0.587, 0.114));",
          "  c = mix(vec3(l), c, 0.88) * vec3(1.03, 1.0, 0.92);", // a little faded and warm, like an old print
          "  c = c * 0.95 + vec3(0.03, 0.026, 0.018);",
          "  vec2 d = vUv - 0.5; c *= 1.0 - dot(d, d) * 0.75;",
          "  vec2 gp = floor(gl_FragCoord.xy / 1.5) + floor(time * 12.0) * 7.0;",
          "  float n = fract(sin(dot(gp, vec2(12.9898, 78.233))) * 43758.5453);",
          "  c += (n - 0.5) * 0.06;",
          "  gl_FragColor = vec4(c, 1.0);",
          "}"
        ].join("\n")
      });
      composer.addPass(finalPass);
      renderer.toneMapping = THREE.NoToneMapping;
    } catch (err) { composer = null; finalPass = null; }
  }

  // ---------- frame ----------
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    if (composer) { composer.setPixelRatio(DPR); composer.setSize(w, h); }
    camera.aspect = w / h;
    var half = Math.tan(camera.fov * Math.PI / 360);
    dist = Math.max(1.05 / half, 1.6 / (half * camera.aspect)) * 1.46;
    camera.updateProjectionMatrix(); placeCamera();
  }
  var last = performance.now(), acc = 0, simT = 240 * H;
  window.addEventListener("resize", resize); resize();
  lastCast = last - 1400;
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (!orbiting) { yaw += yawV * dt; pitch += pitchV * dt; var dk = Math.exp(-dt * 5); yawV *= dk; pitchV *= dk; }
    yaw = Math.max(-1.05, Math.min(1.05, yaw)); pitch = Math.max(0.03, Math.min(0.8, pitch));
    placeCamera();
    var F = FABRICS[fabricName], e = 1 - Math.exp(-dt * 2.2);
    P.full += (F.full - P.full) * e; P.bend += (F.bend - P.bend) * e;
    P.drag += (F.drag - P.drag) * e; P.wind += (F.wind - P.wind) * e;
    acc += dt; var n = 0;
    while (acc >= H && n < 4) { step(simT); simT += H; acc -= H; n++; }
    if (n === 4) acc = 0;
    if (argue && now - lastCast > 3800) {
      var rp = M + Math.floor(Math.random() * (NP - M));
      cast(X[rp], Y[rp], Z[rp], duel[duelTurn % 2], true);
      duelTurn++; lastCast = now;
    }
    dress.rotation.y = theta;
    var pulse = calm ? 1 : 0.8 + 0.3 * Math.sin(now / 1000 * 2.3);
    for (var g = 0; g < glitterMats.length; g++) glitterMats[g].emissiveIntensity = glitterMats[g].userData.sparkle * pulse;
    syncSkirt(); updatePaint(dt); syncPetti(); updateSparks(dt, now / 1000);
    if (finalPass) finalPass.uniforms.time.value = now / 1000;
    if (composer) composer.render(); else renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  syncSkirt(); updatePaint(0.016); syncPetti();
  requestAnimationFrame(frame);
})();
</script>
